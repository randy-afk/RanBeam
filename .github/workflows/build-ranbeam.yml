name: Build RanBeam Executables

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build RanBeam on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: RanBeam
            asset_name: RanBeam-Linux
            data_sep: ":"
          - os: windows-latest
            artifact_name: RanBeam.exe
            asset_name: RanBeam-Windows.exe
            data_sep: ";"
          - os: macos-latest
            artifact_name: RanBeam
            asset_name: RanBeam-macOS
            data_sep: ":"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux GUI System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0

      - name: Install Python Dependencies
        # matplotlib + numpy are bundled because gui/logo.py imports them
        # unconditionally — the header logo is regenerated live from the
        # active theme's colours on every switch (gui/app.py's
        # _switch_theme), not just once at first run.
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install PySide6 matplotlib numpy

      - name: Build Executable with PyInstaller
        shell: bash
        # logo_gui.png/logo_docs.png are shipped pre-rendered (tracked in
        # git) so --add-data must place them at the same gui/ path
        # gui/app.py's _HERE resolves to at runtime, or the packaged app
        # falls back to plain "RanBeam" text in the header.
        run: |
          pyinstaller --onefile --noconsole --name RanBeam \
            --collect-all PySide6 --collect-all matplotlib \
            --add-data "gui/logo_gui.png${{ matrix.data_sep }}gui" \
            --add-data "gui/logo_docs.png${{ matrix.data_sep }}gui" \
            RanBeam.py

      - name: Rename Binary for Asset Upload
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Attach Binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
